<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cantinho</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⭐</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&display=swap" rel="stylesheet">
<style>
:root{
  --hot:#ff3fa4; --bubble:#ff86c8; --candy:#ffc2e2; --blush:#fff0f8;
  --berry:#7a1250; --lilac:#d9c8ff; --white:#fff;
  --display:'Bagel Fat One','Trebuchet MS',sans-serif;
  --body:Verdana,Tahoma,Geneva,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;font:14px/1.55 var(--body);color:var(--berry);
  background-color:#ff5cb0;
  background-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='90' height='90' viewBox='0 0 90 90'><polygon fill='white' fill-opacity='.35' points='45,27 49,39 62,39 51,47 55,59 45,52 35,59 39,47 28,39 41,39'/></svg>");
}
a{color:var(--hot);font-weight:bold}
a:hover{color:var(--berry)}
:focus-visible{outline:3px solid var(--berry);outline-offset:2px}
img{max-width:100%}

/* ---------- topo ---------- */
.top{background:linear-gradient(#ff8ccb,#ff3fa4);border-bottom:3px solid var(--berry)}
.top-in{max-width:1000px;margin:auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{font-family:var(--display);font-size:30px;color:#fff;text-decoration:none;text-shadow:2px 2px 0 var(--berry),-1px -1px 0 var(--berry),1px -1px 0 var(--berry),-1px 1px 0 var(--berry)}
.logo small{display:block;font:11px var(--body);color:#fff;text-shadow:none;margin-top:-4px}
.who{color:#fff;font-size:13px}
.who a{color:#fff}
.who .btn{margin-left:6px}
.nav{background:var(--candy);border-bottom:3px solid var(--berry)}
.nav-in{max-width:1000px;margin:auto;padding:0 10px;display:flex;flex-wrap:wrap}
.nav a{padding:8px 12px;text-decoration:none;color:var(--berry);border-right:1px solid var(--bubble)}
.nav a:hover{background:var(--blush)}
.nav a[aria-current="page"]{background:var(--blush);text-decoration:underline}

main{max-width:1000px;margin:20px auto;padding:0 16px}

/* ---------- janelinhas ---------- */
.win{background:var(--blush);border:2px solid var(--berry);border-radius:12px;box-shadow:5px 5px 0 var(--berry);overflow:hidden;margin-bottom:20px}
.win-bar{background:linear-gradient(#ff8ccb,#ff3fa4);color:#fff;font-family:var(--display);font-size:16px;padding:6px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--berry)}
.win-bar .dots{font-family:var(--body);font-size:12px;letter-spacing:3px}
.win-body{padding:14px}
.win-body>*:first-child{margin-top:0}
.win-body>*:last-child{margin-bottom:0}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0 0 8px;line-height:1.15}
h1{font-size:34px}
.cols{display:grid;grid-template-columns:290px 1fr;gap:20px;align-items:start}
.cols-2{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;align-items:start}
@media(max-width:780px){.cols,.cols-2{grid-template-columns:1fr}}

/* ---------- controles ---------- */
.btn{display:inline-block;font:bold 13px var(--body);color:#fff;background:linear-gradient(#ff7ac0,#ff3fa4);border:2px solid var(--berry);border-radius:8px;padding:6px 14px;cursor:pointer;text-decoration:none;box-shadow:0 3px 0 var(--berry)}
.btn:hover{color:#fff;filter:brightness(1.06)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--berry)}
.btn.alt{background:linear-gradient(#fff,var(--candy));color:var(--berry)}
.btn.alt:hover{color:var(--berry)}
.btn.sm{padding:3px 10px;font-size:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
label{display:block;font-weight:bold;margin:12px 0 4px}
input[type=text],input[type=password],textarea,select{width:100%;font:14px var(--body);color:var(--berry);background:#fff;border:2px solid var(--berry);border-radius:6px;padding:7px 9px}
textarea{min-height:110px;resize:vertical}
.hint{font-size:12px;opacity:.8;margin:3px 0 0}
.err{background:#fff;border:2px dashed var(--hot);padding:8px 10px;border-radius:6px;margin-top:12px}
.empty{text-align:center;padding:18px 8px}
.empty .big{font-size:34px}

/* ---------- perfil ---------- */
.avatar{width:100%;aspect-ratio:1;object-fit:cover;border:2px solid var(--berry);background:var(--candy);display:block}
.mini{width:54px;height:54px;object-fit:cover;border:2px solid var(--berry);display:block}
.bubble{position:relative;background:var(--candy);border:2px solid var(--berry);padding:10px 12px;margin:12px 0 18px;border-radius:4px}
.bubble::after{content:"";position:absolute;left:22px;bottom:-14px;border:7px solid transparent;border-top:7px solid var(--berry);border-left-color:var(--berry)}
.bubble b{display:block;color:var(--hot);font-size:15px}
.kv{width:100%;border-collapse:collapse}
.kv th{width:78px;background:var(--candy);text-align:center;font-size:12px;padding:5px;border:1px solid var(--bubble);vertical-align:top}
.kv td{padding:5px 8px;border:1px solid var(--bubble);font-size:12px}
.friends{display:flex;flex-wrap:wrap;gap:8px}
.friends a{text-decoration:none;font-size:11px;text-align:center;display:block;width:54px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.gallery button{padding:0;border:0;background:none;cursor:pointer;position:relative}
.gallery img{display:block;width:100%;border:2px solid var(--berry);background:#fff}
.gallery .x{position:absolute;top:4px;right:4px}
.item{padding:10px 0;border-bottom:1px dashed var(--bubble)}
.item:last-child{border-bottom:0}
.item .meta{font-size:12px;opacity:.8}
.item p{margin:4px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.scrap{display:flex;gap:10px}
.scrap img{flex:none}
.post-body{white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px;line-height:1.7;max-width:70ch}

/* ---------- câmera ---------- */
.cam{position:relative;max-width:700px;margin:0 auto;filter:drop-shadow(5px 5px 0 var(--berry))}
.cam>img{display:block;width:100%}
.screen{position:absolute;left:8.98%;top:22.96%;width:56.73%;height:65.55%;background:#fff;overflow:hidden}
.screen video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
.screen video.on{display:block}
.screen video.mirror{transform:scaleX(-1)}
.screen .msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;font-size:13px;color:var(--berry)}
.screen .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.screen .flash.go{animation:flash .35s ease-out}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
.shutter{position:absolute;left:87.07%;top:72.2%;width:7%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;border:0;background:transparent;cursor:pointer}
.shutter:hover{box-shadow:0 0 0 3px var(--hot)}
.shot{max-width:700px;margin:0 auto}
.shot img{display:block;width:100%;border:2px solid var(--berry)}

dialog{border:2px solid var(--berry);border-radius:12px;background:var(--blush);padding:10px;box-shadow:6px 6px 0 var(--berry);max-width:min(92vw,760px)}
dialog::backdrop{background:rgba(122,18,80,.55)}
dialog img{display:block;max-width:100%;max-height:75vh}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--berry);color:#fff;padding:9px 16px;border-radius:999px;z-index:50;font-size:13px}
footer{text-align:center;color:#fff;font-size:12px;padding:10px 0 30px}

@media(prefers-reduced-motion:reduce){.screen .flash.go{animation:none}html{scroll-behavior:auto}}

/* ---------- cd player ---------- */
#cd{position:fixed;left:16px;bottom:16px;width:350px;max-width:calc(100vw - 32px);z-index:40;background:#cfc8cd;color:#2a2228;font:12px/1.3 var(--body);
  border:2px solid;border-color:#fff #6b6068 #6b6068 #fff;box-shadow:5px 5px 0 var(--berry)}
#cd[hidden]{display:none}
#cd .bar{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:3px 3px 3px 8px;color:#fff;font:bold 13px var(--body);cursor:move;user-select:none;touch-action:none;background:linear-gradient(90deg,#ff3fa4,#ffa6d6)}
.cd-btn{font:bold 12px var(--body);color:#2a2228;background:#cfc8cd;border:2px solid;border-color:#fff #6b6068 #6b6068 #fff;cursor:pointer;padding:2px 8px;line-height:1.1}
.cd-btn:active{border-color:#6b6068 #fff #fff #6b6068}
#cd .bar .cd-btn{padding:0 5px;min-width:18px;height:16px}
#cd .body{padding:8px}
#cd.min .body{display:none}
.cd-main{display:flex;gap:8px}
.cd-cover{width:86px;height:86px;flex:none;object-fit:cover;background:var(--candy);border:2px solid;border-color:#6b6068 #fff #fff #6b6068}
.cd-fields{flex:1;min-width:0}
.cd-row{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.cd-row>span{width:46px;font-weight:bold}
.cd-field{flex:1;min-width:0;height:28px;padding:4px 6px;background:#fff;color:#2a2228;font:bold 13px var(--body);border:2px solid;border-color:#6b6068 #fff #fff #6b6068;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
select.cd-field{padding:0 2px}
#cdSeek{width:100%;margin:8px 0 4px;accent-color:#ff3fa4}
.cd-btns{display:flex;justify-content:space-between;gap:4px;margin-bottom:8px}
.cd-btns .cd-btn{flex:1;padding:4px 0}
.cd-btns .cd-btn[aria-pressed="true"]{border-color:#6b6068 #fff #fff #6b6068;color:var(--hot)}
#cdSlot,#cd iframe{display:block;width:100%;border:0}
.cd-note{margin:6px 0 0;font-size:11px;opacity:.85}
#cdOpen{position:fixed;left:16px;bottom:16px;z-index:40}
@media(prefers-reduced-motion:reduce){#cdSeek{transition:none}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="logo" href="#/">cantinho<small>um espaço pras amigas ✿</small></a>
    <div class="who" id="who"></div>
  </div>
</header>
<nav class="nav" aria-label="principal">
  <div class="nav-in" id="nav"></div>
</nav>
<main id="app"></main>
<footer>feito com carinho ★ 2026</footer>
<dialog id="lightbox"><img alt=""><div class="row" style="margin-top:8px"><a class="btn sm" id="lbDl" target="_blank" rel="noopener">abrir original</a><button class="btn sm alt" id="lbClose">fechar</button></div></dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* =========================================================
   CONFIGURAÇÃO DO SUPABASE
   Cole aqui a URL e a chave pública (anon key) do seu projeto:
   Supabase → Project Settings → API.
   (A anon key é pública por design; quem protege os dados são as
   regras RLS criadas pelo supabase/setup.sql.)
   ========================================================= */
const SUPABASE_URL = 'COLE_AQUI_A_URL';
const SUPABASE_ANON_KEY = 'COLE_AQUI_A_ANON_KEY';

const sb = SUPABASE_URL.startsWith('COLE') ? null : supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const BUCKET = 'fotos';
const publicUrl = path => sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
async function uploadDataUrl(dataUrl, path){
  const blob = await (await fetch(dataUrl)).blob();
  const { error } = await sb.storage.from(BUCKET).upload(path, blob, { contentType: 'image/jpeg' });
  if(error) throw error;
  return path;
}
const toUser = (r, friends = []) => ({
  id: r.id, username: r.username, name: r.name, photo: r.photo_url, status: r.status, mood: r.mood, about: r.about,
  interests: { geral: r.geral, musica: r.musica, filmes: r.filmes }, createdAt: new Date(r.created_at).getTime(), friends,
});
const ok = ({ error }) => { if(error) throw error };

/* ---------- camada de dados: tudo passa por aqui ---------- */
const db = {
  uid(){ return '' }, // os ids agora são gerados pelo banco
  async _try(fn){ try{ return await fn() }catch(e){ console.error(e); toast('ops: ' + (e.message || 'algo deu errado')); return false } },

  // login
  async currentUser(){
    const { data: { session } } = await sb.auth.getSession();
    return session ? this.userById(session.user.id) : null;
  },
  async signUp({ email, password, username, name }){
    const { data, error } = await sb.auth.signUp({ email, password, options: { data: { username, name } } });
    if(error) throw error; return data;
  },
  async signIn(email, password){ ok(await sb.auth.signInWithPassword({ email, password })) },
  async signOut(){ await sb.auth.signOut() },

  // perfis
  async users(){
    const [p, f] = await Promise.all([sb.from('profiles').select('*').order('created_at'), sb.from('friends').select('user_id,friend_id')]);
    ok(p); ok(f);
    const fm = {}; f.data.forEach(x => (fm[x.user_id] ||= []).push(x.friend_id));
    return p.data.map(r => toUser(r, fm[r.id] || []));
  },
  async userById(id){ return (await this.users()).find(u => u.id === id) },
  async userByName(n){ return (await this.users()).find(u => u.username === n) },
  async saveUser(u){
    return this._try(async () => {
      let photo = u.photo;
      if(photo?.startsWith('data:')) photo = publicUrl(await uploadDataUrl(photo, `${u.id}/avatar-${Date.now()}.jpg`));
      ok(await sb.from('profiles').update({ name: u.name, photo_url: photo, status: u.status, mood: u.mood, about: u.about,
        geral: u.interests.geral, musica: u.interests.musica, filmes: u.interests.filmes }).eq('id', u.id));
      return true;
    });
  },
  async toggleFriend(me, otherId){
    return this._try(async () => {
      const has = (me.friends || []).includes(otherId);
      ok(has ? await sb.from('friends').delete().eq('user_id', me.id).eq('friend_id', otherId)
             : await sb.from('friends').insert({ user_id: me.id, friend_id: otherId }));
    });
  },

  // posts
  async posts(){
    const r = await sb.from('posts').select('*').order('created_at', { ascending: false }); ok(r);
    return r.data.map(x => ({ id: x.id, userId: x.user_id, title: x.title, body: x.body, createdAt: new Date(x.created_at).getTime() }));
  },
  async addPost(p){ return this._try(async () => { ok(await sb.from('posts').insert({ user_id: p.userId, title: p.title, body: p.body })); return true }) },
  async deletePost(id){ return this._try(async () => ok(await sb.from('posts').delete().eq('id', id))) },

  // recados
  async scraps(toId){
    const r = await sb.from('scraps').select('*').eq('to_id', toId).order('created_at', { ascending: false }); ok(r);
    return r.data.map(x => ({ id: x.id, toId: x.to_id, fromId: x.from_id, text: x.text, createdAt: new Date(x.created_at).getTime() }));
  },
  async addScrap(s){ return this._try(async () => { ok(await sb.from('scraps').insert({ to_id: s.toId, from_id: s.fromId, text: s.text })); return true }) },
  async deleteScrap(id){ return this._try(async () => ok(await sb.from('scraps').delete().eq('id', id))) },

  // fotos da câmera
  async photos(userId){
    let q = sb.from('photos').select('*').order('created_at', { ascending: false });
    if(userId) q = q.eq('user_id', userId);
    const r = await q; ok(r);
    return r.data.map(x => ({ id: x.id, userId: x.user_id, path: x.path, dataUrl: publicUrl(x.path), createdAt: new Date(x.created_at).getTime() }));
  },
  async addPhoto(p){
    return this._try(async () => {
      const path = await uploadDataUrl(p.dataUrl, `${p.userId}/${Date.now()}.jpg`);
      ok(await sb.from('photos').insert({ user_id: p.userId, path }));
      return true;
    });
  },
  async deletePhoto(id){
    return this._try(async () => {
      const r = await sb.from('photos').select('path').eq('id', id).single(); ok(r);
      await sb.storage.from(BUCKET).remove([r.data.path]);
      ok(await sb.from('photos').delete().eq('id', id));
    });
  },
};

/* ---------- utilidades ---------- */
const $ = (s, r = document) => r.querySelector(s);
const app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = ts => new Date(ts).toLocaleDateString('pt-BR');
const DEFAULT_AVATAR = "data:image/svg+xml," + encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='#ffc2e2'/><polygon fill='#ff3fa4' points='50,16 58,40 84,40 63,55 71,80 50,65 29,80 37,55 16,40 42,40'/></svg>");
const avatar = u => u?.photo || DEFAULT_AVATAR;
let me = null;

function toast(msg){
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg;
  document.body.append(t); setTimeout(() => t.remove(), 2600);
}
async function sha(s){
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
}
function fileToImage(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); res(img) };
    img.onerror = () => rej(new Error('imagem inválida'));
    img.src = url;
  });
}
function squareCrop(img, size = 320){
  const c = document.createElement('canvas'); c.width = c.height = size;
  const s = Math.min(img.naturalWidth, img.naturalHeight);
  c.getContext('2d').drawImage(img, (img.naturalWidth - s) / 2, (img.naturalHeight - s) / 2, s, s, 0, 0, size, size);
  return c.toDataURL('image/jpeg', .85);
}
const win = (title, body, extra = '') => `<section class="win ${extra}"><div class="win-bar"><span>${title}</span><span class="dots" aria-hidden="true">_ ▢ ✕</span></div><div class="win-body">${body}</div></section>`;
const empty = (emoji, text, action = '') => `<div class="empty"><div class="big" aria-hidden="true">${emoji}</div><p>${text}</p>${action}</div>`;

/* ---------- topo + menu ---------- */
function chrome(){
  $('#who').innerHTML = me
    ? `oi, <a href="#/u/${esc(me.username)}">${esc(me.name)}</a> <a class="btn sm alt" href="#/" id="logout">sair</a>`
    : `<a class="btn sm alt" href="#/entrar">entrar</a><a class="btn sm" href="#/criar">criar perfil</a>`;
  const out = $('#logout'); if(out) out.onclick = async e => { e.preventDefault(); await db.signOut(); me = null; if(location.hash !== '#/') location.hash = '#/'; else route() };
  const links = [['#/', 'início'], ['#/blog', 'blog'], ['#/perfis', 'perfis'], ['#/camera', 'câmera']];
  if(me) links.push([`#/u/${me.username}`, 'meu perfil']);
  const cur = location.hash || '#/';
  $('#nav').innerHTML = links.map(([h, t]) => `<a href="${esc(h)}" ${cur === h ? 'aria-current="page"' : ''}>${t}</a>`).join('');
}

/* ---------- páginas ---------- */
async function home(){
  const [posts, users, photos] = await Promise.all([db.posts(), db.users(), db.photos()]);
  const byId = Object.fromEntries(users.map(u => [u.id, u]));
  const postList = posts.length
    ? posts.slice(0, 5).map(p => `<div class="item"><a href="#/post/${p.id}">${esc(p.title)}</a><div class="meta">por ${esc(byId[p.userId]?.name || '?')} · ${fmt(p.createdAt)}</div></div>`).join('')
    : empty('✎', 'ainda não tem nenhum post por aqui.', me ? '<a class="btn" href="#/novo-post">escrever o primeiro</a>' : '<a class="btn" href="#/criar">criar perfil pra escrever</a>');
  const newPeople = users.length
    ? `<div class="friends">${users.slice(-8).reverse().map(u => `<a href="#/u/${esc(u.username)}"><img class="mini" src="${avatar(u)}" alt="">${esc(u.name)}</a>`).join('')}</div>`
    : empty('✿', 'nenhum perfil ainda. seja a primeira!', '<a class="btn" href="#/criar">criar perfil</a>');

  app.innerHTML = `
    <div class="cols-2">
      <div>
        ${win('bem-vinda ao cantinho ★', `
          <h1>oi, amiga!</h1>
          <p>aqui cada uma tem seu perfil, deixa recado, escreve no blog e tira foto na câmera rosa. tudo bem anos 2000.</p>
          <div class="row">${me ? '<a class="btn" href="#/novo-post">escrever post</a>' : '<a class="btn" href="#/criar">criar meu perfil</a>'}<a class="btn alt" href="#/blog">ler o blog</a></div>`)}
        ${win('últimos posts', postList)}
      </div>
      <div>
        <a href="#/camera" aria-label="ir pra câmera" style="display:block;margin-bottom:20px;filter:drop-shadow(5px 5px 0 var(--berry))"><img src="camera.png" alt="câmera digital rosa" style="display:block;width:100%"></a>
        ${win('perfis novos', newPeople)}
        ${photos.length ? win('fotos recentes', `<div class="gallery">${photos.slice(0, 4).map(ph => `<button data-photo="${ph.id}"><img src="${ph.dataUrl}" alt="foto de ${esc(byId[ph.userId]?.name || '')}"></button>`).join('')}</div>`) : ''}
      </div>
    </div>`;
  bindGallery(photos);
}

async function blog(){
  const [posts, users] = await Promise.all([db.posts(), db.users()]);
  const byId = Object.fromEntries(users.map(u => [u.id, u]));
  app.innerHTML = win('blog', `

/* ---------- câmera ---------- */
const tpl = new Image(); tpl.src = 'camera.png';
const SCREEN = { x: 66, y: 110, w: 417, h: 314 }; // área branca da tela dentro do camera.png (735x479)
let stream = null, facing = 'user', lastShot = null;

function stopCam(){ stream?.getTracks().forEach(t => t.stop()); stream = null }

function compose(source, sw, sh, mirror){
  const c = document.createElement('canvas'); c.width = 735; c.height = 479;
  const x = c.getContext('2d');
  x.drawImage(tpl, 0, 0, 735, 479);
  const { x: dx, y: dy, w: dw, h: dh } = SCREEN;
  const r = Math.max(dw / sw, dh / sh), cw = dw / r, ch = dh / r, sx = (sw - cw) / 2, sy = (sh - ch) / 2;
  x.save(); x.beginPath(); x.rect(dx, dy, dw, dh); x.clip();
  if(mirror){ x.translate(dx + dw, dy); x.scale(-1, 1); x.drawImage(source, sx, sy, cw, ch, 0, 0, dw, dh) }
  else x.drawImage(source, sx, sy, cw, ch, dx, dy, dw, dh);
  x.restore();
  const d = new Date(), p = n => String(n).padStart(2, '0');
  x.font = 'bold 15px "Courier New",monospace'; x.textAlign = 'right';
  x.shadowColor = 'rgba(0,0,0,.65)'; x.shadowBlur = 2;
  x.fillStyle = '#ff9a1f'; x.fillText(`'${String(d.getFullYear()).slice(2)}  ${p(d.getMonth() + 1)}  ${p(d.getDate())}`, dx + dw - 10, dy + dh - 10);
  return c.toDataURL('image/jpeg', .88);
}

async function camera(){
  app.innerHTML = win('câmera', `
    <div class="cam">
      <img src="camera.png" alt="câmera digital rosa">
      <div class="screen">
        <video id="vid" playsinline muted autoplay></video>
        <div class="msg" id="msg">ligue a câmera ou envie uma foto</div>
        <div class="flash" id="flash"></div>
      </div>
      <button class="shutter" id="shutter" aria-label="tirar foto" title="tirar foto"></button>
    </div>
    <div class="row" style="justify-content:center;margin:20px 0 4px">
      <button class="btn" id="on">ligar câmera</button>
      <button class="btn alt" id="flip">virar câmera</button>
      <button class="btn alt" id="snap">tirar foto</button>
      <label class="btn alt" style="margin:0">enviar foto<input id="up" type="file" accept="image/*" hidden></label>
    </div>
    <p class="hint" style="text-align:center">dica: o botão redondo da câmera também tira a foto.</p>
    <div id="result"></div>`);
  const vid = $('#vid'), msg = $('#msg');

  async function start(){
    stopCam();
    if(!navigator.mediaDevices?.getUserMedia){ msg.textContent = 'seu navegador não liberou a câmera. use "enviar foto".'; return }
    try{
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing, width: { ideal: 1280 } }, audio: false });
      vid.srcObject = stream; vid.classList.add('on'); vid.classList.toggle('mirror', facing === 'user'); msg.style.display = 'none';
    }catch{
      msg.style.display = ''; msg.textContent = 'não deu pra acessar a câmera. libere a permissão no navegador ou use "enviar foto".';
    }
  }
  function flash(){ const f = $('#flash'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go') }
  function snap(){
    if(!stream || !vid.videoWidth){ toast('ligue a câmera primeiro'); return }
    flash(); showShot(compose(vid, vid.videoWidth, vid.videoHeight, facing === 'user'));
  }
  $('#on').onclick = start;
  $('#flip').onclick = () => { facing = facing === 'user' ? 'environment' : 'user'; start() };
  $('#snap').onclick = snap; $('#shutter').onclick = snap;
  $('#up').onchange = async e => {
    const f = e.target.files[0]; if(!f) return;
    try{ const img = await fileToImage(f); flash(); showShot(compose(img, img.naturalWidth, img.naturalHeight, false)) }
    catch{ toast('não consegui ler essa imagem') }
  };
  if(!tpl.complete) await new Promise(r => { tpl.onload = r; tpl.onerror = r });
}

function showShot(dataUrl){
  lastShot = dataUrl;
  $('#result').innerHTML = `<div class="shot" style="margin-top:20px"><img src="${dataUrl}" alt="foto que você acabou de tirar">
    <div class="row" style="margin-top:10px">
      ${me ? '<button class="btn" id="save">salvar no meu perfil</button>' : '<a class="btn" href="#/entrar">entre pra salvar no perfil</a>'}
      <a class="btn alt" id="dl" download="foto-cantinho.jpg" href="${dataUrl}">baixar</a>

  root.innerHTML = `
    <div class="bar" id="cdBar"><span>💿 CD Player</span><span><button class="cd-btn" id="cdMin" aria-label="minimizar">_</button> <button class="cd-btn" id="cdClose" aria-label="fechar">✕</button></span></div>
    <div class="body">
      <div class="cd-main">
        <img class="cd-cover" id="cdCover" alt="">
        <div class="cd-fields">
          <div class="cd-row"><span>Artista:</span><div class="cd-field" id="cdArtist">—</div></div>
          <div class="cd-row"><span>Faixa:</span><select class="cd-field" id="cdTrack" aria-label="escolher faixa"></select></div>
        </div>
      </div>
      <input type="range" id="cdSeek" min="0" max="100" value="0" step="1" aria-label="progresso da música">
      <div class="cd-btns">
        <button class="cd-btn" id="cdPrev" aria-label="anterior">◀◀</button>
        <button class="cd-btn" id="cdNext" aria-label="próxima">▶▶</button>
        <button class="cd-btn" id="cdPlay" aria-label="tocar ou pausar">▶</button>
        <button class="cd-btn" id="cdStop" aria-label="parar">■</button>
        <button class="cd-btn" id="cdShuf" aria-label="ordem aleatória" aria-pressed="false">●</button>
      </div>
      <div id="cdEmbed"><div id="cdSlot"></div></div>
      <p class="cd-note" id="cdNote">dica: entre no Spotify pelo player acima pra ouvir a música inteira.</p>
    </div>`;
  document.body.append(root);

  const reopen = document.createElement('button');
  reopen.id = 'cdOpen'; reopen.className = 'cd-btn'; reopen.textContent = '💿 cd player'; reopen.hidden = true;
  document.body.append(reopen);

  const q = id => root.querySelector('#' + id);
  const artist = q('cdArtist'), sel = q('cdTrack'), cover = q('cdCover'), seek = q('cdSeek'), playBtn = q('cdPlay');
  if(innerWidth < 600) root.classList.add('min');

  /* janela: minimizar, fechar, arrastar */
  q('cdMin').onclick = () => root.classList.toggle('min');
  q('cdClose').onclick = () => { root.hidden = true; reopen.hidden = false };
  reopen.onclick = () => { root.hidden = false; reopen.hidden = true };
  const bar = q('cdBar');
  bar.addEventListener('pointerdown', e => {
    if(e.target.closest('button')) return;
    e.preventDefault(); bar.setPointerCapture(e.pointerId);
    const r = root.getBoundingClientRect(), dx = e.clientX - r.left, dy = e.clientY - r.top;
    const move = ev => {
      root.style.left = Math.min(Math.max(0, ev.clientX - dx), innerWidth - r.width) + 'px';
      root.style.top = Math.min(Math.max(0, ev.clientY - dy), innerHeight - 30) + 'px';
      root.style.bottom = 'auto';
    };
    const up = () => { bar.removeEventListener('pointermove', move); bar.removeEventListener('pointerup', up); bar.removeEventListener('pointercancel', up) };
    bar.addEventListener('pointermove', move); bar.addEventListener('pointerup', up); bar.addEventListener('pointercancel', up);
  });

  /* sem músicas ainda */
  if(!tracks.length){
    artist.textContent = 'adicione músicas'; cover.src = DEFAULT_AVATAR;
    sel.innerHTML = '<option>(vazio)</option>'; sel.disabled = true; seek.disabled = true;
    root.querySelectorAll('.cd-btns .cd-btn').forEach(b => b.disabled = true);
    q('cdEmbed').hidden = true;
    q('cdNote').textContent = 'cole links de músicas do Spotify na lista TRACKS, no final do index.html.';
    return;
  }

  /* lista de faixas + busca de título/capa quando faltar */
  const label = t => `${t.artist ? t.artist + ' – ' : ''}${t.title || '…'}`;
  function fillSelect(){
    sel.innerHTML = '';
    tracks.forEach((t, i) => { const o = document.createElement('option'); o.value = i; o.textContent = label(t); sel.append(o) });
    sel.value = idx;
  }
  async function enrich(t){
    if(t.title && t.cover) return;
    try{
      const r = await fetch('https://open.spotify.com/oembed?url=' + encodeURIComponent('https://open.spotify.com/' + t.uri.split(':').slice(1).join('/')));
      const j = await r.json(); t.title ||= j.title; t.cover ||= j.thumbnail_url;
    }catch{ /* sem internet ou bloqueado: segue com o que tem */ }
  }

  let ctrl = null, idx = 0, dragging = false, shuffle = false, lastNext = 0;
  function show(){ const t = tracks[idx]; artist.textContent = t.artist || '—'; cover.src = t.cover || DEFAULT_AVATAR; sel.value = idx }
  function load(auto){
    show(); if(!ctrl) return;
    ctrl.loadUri(tracks[idx].uri); seek.value = 0;
    if(auto) setTimeout(() => ctrl.play(), 400);
  }
  function step(d, auto){
    const n = tracks.length;
    idx = shuffle && n > 1 ? (idx + 1 + Math.floor(Math.random() * (n - 1))) % n : (idx + d + n) % n;
    load(auto);
  }

  fillSelect(); show();
  Promise.all(tracks.map(enrich)).then(() => { fillSelect(); show() });

  sel.onchange = () => { idx = +sel.value; load(true) };
  q('cdPrev').onclick = () => step(-1, true);
  q('cdNext').onclick = () => step(1, true);
  playBtn.onclick = () => ctrl?.togglePlay();
  q('cdStop').onclick = () => { ctrl?.pause(); ctrl?.seek(0); seek.value = 0 };
  q('cdShuf').onclick = e => { shuffle = !shuffle; e.currentTarget.setAttribute('aria-pressed', shuffle) };
  seek.oninput = () => { dragging = true };
  seek.onchange = () => { ctrl?.seek(+seek.value); dragging = false };

  /* Spotify iFrame API */
  window.onSpotifyIframeApiReady = IFrameAPI => {
    IFrameAPI.createController(q('cdSlot'), { uri: tracks[idx].uri, width: '100%', height: 80 }, c => {
      ctrl = c;
      c.addListener('playback_update', e => {
        const d = e.data || {};
        playBtn.textContent = d.isPaused ? '▶' : '❚❚';
        if(!dragging){ seek.max = Math.max(1, Math.floor((d.duration || 0) / 1000)); seek.value = Math.floor((d.position || 0) / 1000) }
        if(d.duration > 0 && d.position >= d.duration - 300 && Date.now() - lastNext > 3000){ lastNext = Date.now(); step(1, true) }
      });
    });
  };
  const sc = document.createElement('script'); sc.src = 'https://open.spotify.com/embed/iframe-api/v1'; sc.async = true; document.body.append(sc);
})();
</script>
</body>
</html>
